# ============================================================================
# IgniWise - Workflow de Setup Inicial
# ============================================================================
# Se ejecuta UNA SOLA VEZ manualmente para generar la primera predicción.
#
# v2: el modelo y los datos geográficos se leen del repositorio directamente.
# Ya no se descargan de Zenodo. Asegúrate de haber subido al repo:
#   - models/random_forest_v1.pkl
#   - data/processed/provincias_geo.geojson
#   - data/processed/training_data.csv
#
# Trigger: Manual (workflow_dispatch)
# ============================================================================

name: Initial Setup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ======================================================================
      # PASO 1: Checkout (incluye todos los archivos del repo)
      # ======================================================================
      - name: 📥 Checkout repositorio
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ======================================================================
      # PASO 2: Configurar Python
      # ======================================================================
      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # ======================================================================
      # PASO 3: Instalar dependencias
      # ======================================================================
      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================================
      # PASO 4: Verificar archivos del repositorio
      # ======================================================================
      - name: 🔍 Verificar archivos del repo
        run: |
          echo "============================================"
          echo "Verificando archivos necesarios en el repo:"
          echo "============================================"
          
          # Modelo
          if [ -f models/random_forest_v1.pkl ]; then
            echo "✓ Modelo: $(ls -lh models/random_forest_v1.pkl | awk '{print $5}')"
          else
            echo "❌ FALTA: models/random_forest_v1.pkl"
            echo "   Sube el modelo generado en el Colab notebook."
            exit 1
          fi
          
          # Geodata
          if [ -f data/processed/provincias_geo.geojson ]; then
            echo "✓ Geodata: $(ls -lh data/processed/provincias_geo.geojson | awk '{print $5}')"
          else
            echo "❌ FALTA: data/processed/provincias_geo.geojson"
            exit 1
          fi
          
          # Training data
          if [ -f data/processed/training_data.csv ]; then
            echo "✓ Training data: $(ls -lh data/processed/training_data.csv | awk '{print $5}')"
          else
            echo "⚠ data/processed/training_data.csv no encontrado (opcional para predict)"
          fi
          
          echo "============================================"
          echo "✅ Todos los archivos verificados"

      # ======================================================================
      # PASO 5: Generar primera predicción
      # ======================================================================
      - name: 🔮 Generar predicciones iniciales
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: |
          echo "Generando predicciones para todas las provincias..."
          python src/modeling/predict.py
          echo "✓ Predicciones generadas"
          ls -lh data/predictions/

      # ======================================================================
      # PASO 6: Commit y push
      # ======================================================================
      - name: 💾 Guardar predicciones
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add data/predictions/
          git diff --staged --quiet || git commit -m "🚀 Setup inicial: primera predicción con datos reales"
          git push
          
          echo "✅ Setup inicial completado"
