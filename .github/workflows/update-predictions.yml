# ============================================================================
# IgniWise - Workflow de Actualización de Predicciones
# ============================================================================
# Ejecuta predict.py cada 6 horas para actualizar current_windows.json.
# ============================================================================

name: Actualizar Predicciones

on:
  schedule:
    - cron: '0 */6 * * *'   # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/modeling/predict.py'
      - 'data/processed/provincias_geo.geojson'
      - 'models/random_forest_v1.pkl'
      - '.github/workflows/update-predictions.yml'

jobs:
  predict:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ======================================================================
      # PASO 1: Checkout (incluye modelo y geodata del repo)
      # ======================================================================
      - name: 📥 Checkout repositorio
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ======================================================================
      # PASO 2: Configurar Python
      # ======================================================================
      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # ======================================================================
      # PASO 3: Instalar dependencias
      # ======================================================================
      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================================
      # PASO 4: Verificar que los archivos clave existen en el repo
      # ======================================================================
      - name: 🔍 Verificar archivos
        run: |
          echo "Verificando archivos necesarios..."
          
          if [ ! -f models/random_forest_v1.pkl ]; then
            echo "❌ models/random_forest_v1.pkl no encontrado"
            exit 1
          fi
          echo "✓ Modelo encontrado: $(ls -lh models/random_forest_v1.pkl | awk '{print $5}')"
          
          if [ ! -f data/processed/provincias_geo.geojson ]; then
            echo "❌ data/processed/provincias_geo.geojson no encontrado"
            exit 1
          fi
          echo "✓ Geodata encontrada: $(ls -lh data/processed/provincias_geo.geojson | awk '{print $5}')"

      # ======================================================================
      # PASO 5: Generar predicciones
      # ======================================================================
      - name: 🔮 Generar predicciones
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: |
          echo "Generando predicciones para todas las provincias..."
          python src/modeling/predict.py
          echo "✓ Predicciones actualizadas"

      # ======================================================================
      # PASO 6: Verificar predicciones generadas
      # ======================================================================
      - name: 📊 Verificar predicciones
        run: |
          if [ ! -f data/predictions/current_windows.json ]; then
            echo "❌ No se generó archivo de predicciones"
            exit 1
          fi
          if [ ! -s data/predictions/current_windows.json ]; then
            echo "❌ Archivo de predicciones está vacío"
            exit 1
          fi
          echo "✓ Predicciones generadas correctamente"
          wc -l data/predictions/current_windows.json

      # ======================================================================
      # PASO 7: Commit y push (solo si hay cambios)
      # ======================================================================
      - name: 💾 Actualizar repositorio
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git pull --rebase origin main || echo "Nothing to pull"
          git add data/predictions/current_windows.json
          
          if git diff --staged --quiet; then
            echo "ℹ️  Sin cambios en predicciones"
          else
            git commit -m "🔮 Predicciones actualizadas - $(date +'%d/%m/%Y %H:%M UTC')"
            git push
            echo "✅ Predicciones guardadas en repositorio"
          fi
